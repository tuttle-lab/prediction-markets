[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-markets"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
predict = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["prediction_markets*", "cli*"]
